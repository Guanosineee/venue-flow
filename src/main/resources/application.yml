server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 端口与 docker-compose.yml 的映射保持一致；本机端口被占用时改映射并同步改此处
    url: jdbc:mysql://localhost:3306/venue_flow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:                      # v2 迭代：连接池（配合 RedisPoolConfig 关闭共享单连接）
          enabled: true
          max-active: 32
          max-idle: 32
          min-idle: 8
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # ⭐丢失三环节之①生产端 confirm：broker 收到回 ack，等不到=发丢了（配合 RabbitTemplate 的 ConfirmCallback 记日志/重发）
    publisher-confirm-type: correlated
    # 路由不到队列时回调 ReturnsCallback（配合 mandatory）
    publisher-returns: true
    listener:
      simple:
        # ⭐消费失败不重回队列（防无限重投循环）→ 交给 order.queue 的死信交换机进 order.dlx.queue 人工/补偿处理
        default-requeue-rejected: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 学习期开 SQL 日志：压测时能亲眼看到"缓存命中后 SQL 消失"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

venue-flow:
  # true = 开放"翻车版"秒杀接口 + 验证码回显（压测看超卖用，生产绝不）
  unsafe: true
  # 展馆详情缓存策略，三挡可切换压测对比：pass-through | mutex | logical-expire
  cache-mode: pass-through
